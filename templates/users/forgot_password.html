{% extends 'base.html' %}

{% block content %}
<div class="min-h-[calc(100vh-80px)] flex items-center justify-center relative overflow-hidden py-12 px-4 sm:px-6 lg:px-8">
    <!-- Background Decor -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-full max-w-4xl -z-10 opacity-30 pointer-events-none">
        <div class="absolute top-10 left-1/3 w-72 h-72 bg-brand-primary/20 rounded-full blur-[80px] animate-pulse"></div>
        <div class="absolute bottom-10 right-1/3 w-80 h-80 bg-brand-accent/20 rounded-full blur-[80px] animate-pulse" style="animation-delay: 1.5s;"></div>
    </div>

    <div class="glass-card max-w-md w-full p-8 md:p-10 border border-slate-200/60 relative z-10 animate-[fadeIn_0.5s_ease-out]">
        <div id="form-header" class="text-center mb-8">
            <h2 class="text-3xl font-display font-bold text-slate-900 tracking-tight">Forgot Password?</h2>
            <p id="header-text" class="mt-2 text-sm text-slate-500">Enter your mobile number or email to continue</p>
        </div>

        <!-- Initial Form -->
        <form id="forgot-password-form" class="space-y-6" method="POST">
            {% csrf_token %}
            <div id="error-box" class="hidden bg-red-50 border border-red-100 text-red-600 p-4 rounded-xl text-sm flex items-start gap-2">
                <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <div id="error-text"></div>
            </div>

            <div class="space-y-4">
                <div>
                    <label for="{{ form.mobile_or_email.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1.5 ml-1">Mobile or Email</label>
                    {{ form.mobile_or_email }}
                </div>
            </div>

            <div>
                <button type="submit" id="submit-btn" class="btn-primary w-full shadow-lg shadow-brand-primary/25 justify-center py-3.5 text-base">
                    Next
                </button>
            </div>
        </form>

        <!-- Verification Step (Hidden Initially) -->
        <div id="verification-step" class="hidden mt-8 space-y-6 text-center">
            <div id="id-display" class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl text-sm text-indigo-700 font-medium mb-4"></div>
            
            <p class="text-sm text-slate-600 mb-6">Click below to verify your identity and reset password</p>
            
            <div id="pe-container" class="flex justify-center">
                <!-- Phone Email button will be injected here -->
            </div>

            <div id="status-message" class="hidden text-center mt-4 p-4 rounded-xl text-sm border"></div>
            
            <button onclick="resetFlow()" class="mt-6 text-sm text-slate-500 hover:text-brand-primary underline transition-colors">
                Use a different account
            </button>
        </div>

        <div id="footer-links" class="text-center mt-8">
            <p class="text-sm text-slate-600">
                Remember your password? <a href="{% url 'login' %}" class="font-bold text-brand-primary hover:text-brand-dark transition-colors">Sign in</a>
            </p>
        </div>
    </div>
</div>

<!-- Load Phone Email SDKs (both, but we will use the right one) -->
<script src="https://www.phone.email/sign_in_button_v1.js" async></script>
<script src="https://www.phone.email/verify_email_v1.js" async></script>

<script>
const CLIENT_ID = "13443371295433469166";

document.getElementById('forgot-password-form').onsubmit = function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const submitBtn = document.getElementById('submit-btn');
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text'); // Added sub-element for text
    
    submitBtn.disabled = true;
    submitBtn.innerText = "Checking...";
    errorBox.classList.add('hidden');

    fetch(window.location.href, {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': formData.get('csrfmiddlewaretoken')
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            showVerification(data.verification_type, formData.get('mobile_or_email'));
        } else {
            document.getElementById('error-text').innerText = data.message || "An error occurred."; // Fix selector
            errorBox.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.innerText = "Next";
        }
    })
    .catch(error => {
        console.error('Error:', error);
        document.getElementById('error-text').innerText = "Network error. Please try again.";
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerText = "Next";
    });
};

function showVerification(type, identifier) {
    document.getElementById('forgot-password-form').classList.add('hidden');
    document.getElementById('verification-step').classList.remove('hidden');
    document.getElementById('id-display').innerText = identifier;
    document.getElementById('header-text').innerText = "Verify your account";
    
    const container = document.getElementById('pe-container');
    container.innerHTML = ''; // Clear previous
    
    if (type === 'mobile') {
        const div = document.createElement('div');
        div.className = 'pe_signin_button';
        div.setAttribute('data-client-id', CLIENT_ID);
        container.appendChild(div);
        
        if (window.phoneEmailListener) {
             const script = document.createElement('script');
             script.src = "https://www.phone.email/sign_in_button_v1.js";
             script.async = true;
             container.appendChild(script);
        }
    } else {
        const div = document.createElement('div');
        div.className = 'pe_verify_email';
        div.setAttribute('data-client-id', CLIENT_ID);
        container.appendChild(div);
        const script = document.createElement('script');
        script.src = "https://www.phone.email/verify_email_v1.js";
        script.async = true;
        container.appendChild(script);
    }
}

function resetFlow() {
    document.getElementById('forgot-password-form').classList.remove('hidden');
    document.getElementById('verification-step').classList.add('hidden');
    document.getElementById('header-text').innerText = "Enter your mobile number or email to continue";
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('submit-btn').innerText = "Next";
}

function handleVerification(userObj) {
    const user_json_url = userObj.user_json_url;
    const statusMsg = document.getElementById('status-message');
    
    statusMsg.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'border-red-100', 'bg-green-50', 'text-green-600', 'border-green-100');
    statusMsg.classList.add('bg-blue-50', 'text-blue-600', 'border-blue-100');
    statusMsg.innerText = "Finalizing...";

    fetch(`/auth/phone-email-callback/?user_json_url=${encodeURIComponent(user_json_url)}`)
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                statusMsg.classList.remove('bg-blue-50', 'text-blue-600', 'border-blue-100');
                statusMsg.classList.add('bg-green-50', 'text-green-600', 'border-green-100');
                statusMsg.innerText = "Verified! Redirecting...";
                setTimeout(() => {
                    window.location.href = data.redirect_url;
                }, 800);
            } else {
                statusMsg.classList.remove('bg-blue-50', 'text-blue-600', 'border-blue-100');
                statusMsg.classList.add('bg-red-50', 'text-red-600', 'border-red-100');
                statusMsg.innerText = data.message || "Verification failed.";
            }
        });
}

function phoneEmailListener(userObj) { handleVerification(userObj); }
function phoneEmailReceiver(userObj) { handleVerification(userObj); }
</script>
{% endblock %}
